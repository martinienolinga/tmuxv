# ~/.tmux.conf — tmux 3.4

# ── Général ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"   # vraies couleurs 24 bits
set -g mouse on
set -s set-clipboard on               # copie vers le presse-papiers via OSC 52
set -g history-limit 100000
set -s escape-time 10                 # pas de délai sur la touche Échap
set -g focus-events on
set -g display-time 2000

# Fenêtres et panneaux numérotés à partir de 1, renumérotation auto
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g visual-activity on

# ── Raccourcis ───────────────────────────────────────────────────
# Recharger la config : préfixe + r
bind r source-file /home/martinien/tmux/tests/user.conf \; display "Config rechargée"

# Découpage : préfixe + | (vertical) et préfixe + - (horizontal),
# en conservant le répertoire courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigation entre panneaux sans préfixe : Alt + flèches
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Fenêtre précédente/suivante sans préfixe : Alt+Maj + flèches
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# ── Barre de statut : sobre et lisible ───────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%d %b #[fg=#cdd6f4,bold]%H:%M "
set -g status-right-length 30
setw -g window-status-format "#[fg=#a6adc8] #I:#W "
setw -g window-status-current-format "#[bg=#45475a,fg=#f5e0dc,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#45475a,fg=#f5e0dc"

# ── Plugins (TPM) ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # préfixe+Ctrl+s : sauver, préfixe+Ctrl+r : restaurer
set -g @plugin '2kabhishek/tmux2k'             # thème de barre de statut

# Configuration tmux2k
set -g @tmux2k-theme 'duo'
#set -g @tmux2k-icons-only true
set -g @tmux2k-duo-fg "#98FB98" # this will get you duo blue shown above
set -g @tmux2k-duo-bg "#000000" # this will set the bg for duo theme
set -g @tmux2k-right-plugins "cpu ram time"
set -g @tmux2k-enable-popups false   # clic sur la barre = bascule directe (pas de popup)

# Initialisation de TPM (doit rester en dernière ligne)
run '~/.tmux/plugins/tpm/tpm'

# ── Ajouts pour les tests uniquement ─────────────────────────────
set -g @resurrect-dir '/tmp/tmuxv-tests/resurrect'
